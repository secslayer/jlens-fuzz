    produces: results/phi4mini/validate_signal.json
    config: configs/exp_phi4mini.yaml
    cmd: "python scripts/validate_signal.py --config {config} --out results/phi4mini/validate_signal.json --probes results/phi4mini/probes/probe_best_layer.npz --direction results/phi4mini/direction.npz"

  gptfuzzer_phi4mini:
    lane: extended
    needs: []
    produces: results/phi4mini/gptfuzzer.json
    config: configs/exp_phi4mini.yaml
    cmd: "python scripts/run_fuzz.py --config {config} --method gptfuzzer --out results/phi4mini/gptfuzzer.json"

  ours_phi4mini:
    lane: extended
