# experiments.yaml — the orchestration source of truth.
# Each job: id, lane (core|extended), needs (dep job ids), produces (file that proves it's done),
# cmd (what run_experiment.py runs). The controller reads this to compute what to run next and
# is fully RESUMABLE: it infers status from `produces` existing on disk, so a dead Kaggle session
# never loses your place. CORE lane = the 1-week preprint. EXTENDED = the fuller paper, later.

defaults:
  config: configs/exp.yaml

jobs:
  # ---- signal extraction (Components 2) ----
  probes:                       # logistic refusal probe -> FITNESS classifier
    lane: core
    needs: []
    produces: results/probes/best_layer.json
    cmd: "python scripts/train_probes.py --config {config} --out results/probes"

  direction:                    # difference-in-means refusal direction -> TOKEN ATTRIBUTION (where to mutate)
    lane: core
    needs: []
    produces: results/direction.npz
    cmd: "python scripts/extract_direction.py --config {config} --out results/direction.npz"

  validate:                     # RQ-evidence + sanity gate: does the signal correlate with real refusal?
    lane: core
    needs: [probes, direction]
    produces: results/validate_signal.json
    cmd: "python scripts/validate_signal.py --config {config}"

  # ---- baselines (identical conditions; see CLAUDE.md rule 3) ----
  # 3 seeds per condition (PLAN.md §10 rigor requirement, locked 2026-08-06) — same rule as the
  # `ours`/ablation jobs below; the baseline needs CIs too for a fair comparison.
  gptfuzzer:                    # black-box control (no internal signal) — RQ1 denominator
    lane: core
    needs: []
    produces: results/gptfuzzer.json
    cmd: "python scripts/run_fuzz.py --config {config} --method gptfuzzer"

  gptfuzzer_seed1:
    lane: core
    needs: []
    produces: results/gptfuzzer_seed1.json
    cmd: "python scripts/run_fuzz.py --config {config} --method gptfuzzer --seed 1 --out results/gptfuzzer_seed1.json"

  gptfuzzer_seed2:
    lane: core
    needs: []
    produces: results/gptfuzzer_seed2.json
    cmd: "python scripts/run_fuzz.py --config {config} --method gptfuzzer --seed 2 --out results/gptfuzzer_seed2.json"

  autodan:
    lane: extended
    needs: []
    produces: results/autodan.json
    cmd: "python scripts/run_fuzz.py --config {config} --method autodan"

  amnesia:                      # activation-steering baseline (2603.10080)
    lane: extended
    needs: [direction]
    produces: results/amnesia.json
    cmd: "python scripts/run_amnesia.py --config {config}"

  # ---- our method + ablations (Components 1,3,4) ----
  # NOTE (Gate 2, 2026-08-05, reviews/stage2-human-signoff.md): probe-based fitness (judge+act)
  # is NOT validated — the probe passed its held-out AUC (1.0) but FAILED the novel-prompt
  # generalization check (0.5 acc on 6 hand-written prompts), overfitting a surface confound
  # (AdvBench-imperative vs Alpaca-mixed phrasing). The direction signal (token-attribution /
  # guided-mutation, Component 3) PASSED cleanly and is unaffected. Core-lane fitness defaults
  # to judge-only (validated in Stage 1) until the probe is fixed and re-validated — see
  # abl_fitness_probeact below and the tracked follow-up issue.
  # 3 seeds per condition (PLAN.md §10 rigor requirement, locked 2026-08-06): the base job below
  # (no suffix) uses cfg["seed"]=0; _seed1/_seed2 override via run_fuzz.py's --seed flag. All
  # three must complete before reporting ASR/queries-to-success with a confidence interval for
  # this condition — a single seed is not sufficient (PLAN.md §10: "will not survive review").
  ours:                         # guided-span mutation (direction-driven) + judge-only fitness
    lane: core
    needs: [probes, direction]
    produces: results/ours.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier human --fitness judge"

  ours_seed1:
    lane: core
    needs: [probes, direction]
    produces: results/ours_seed1.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier human --fitness judge --seed 1 --out results/ours_seed1.json"

  ours_seed2:
    lane: core
    needs: [probes, direction]
    produces: results/ours_seed2.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier human --fitness judge --seed 2 --out results/ours_seed2.json"

  abl_mut_uniform:              # RQ1 isolation: same loop, mutate WHOLE prompt (not the attributed span)
    lane: core
    needs: [probes, direction]
    produces: results/abl_mut_uniform.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation uniform --seedtier human --fitness judge"

  abl_mut_uniform_seed1:
    lane: core
    needs: [probes, direction]
    produces: results/abl_mut_uniform_seed1.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation uniform --seedtier human --fitness judge --seed 1 --out results/abl_mut_uniform_seed1.json"

  abl_mut_uniform_seed2:
    lane: core
    needs: [probes, direction]
    produces: results/abl_mut_uniform_seed2.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation uniform --seedtier human --fitness judge --seed 2 --out results/abl_mut_uniform_seed2.json"

  abl_seed_bootstrap:           # RQ2 seed tier (b): model-bootstrapped seeds
    lane: core
    needs: [probes, direction]
    produces: results/abl_seed_bootstrap.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier bootstrap --fitness judge"

  abl_seed_bootstrap_seed1:
    lane: core
    needs: [probes, direction]
    produces: results/abl_seed_bootstrap_seed1.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier bootstrap --fitness judge --seed 1 --out results/abl_seed_bootstrap_seed1.json"

  abl_seed_bootstrap_seed2:
    lane: core
    needs: [probes, direction]
    produces: results/abl_seed_bootstrap_seed2.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier bootstrap --fitness judge --seed 2 --out results/abl_seed_bootstrap_seed2.json"

  abl_seed_random:              # RQ2 seed tier (c): random innocuous seeds (the hardest, headline)
    lane: core
    needs: [probes, direction]
    produces: results/abl_seed_random.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier random --fitness judge"

  abl_seed_random_seed1:
    lane: core
    needs: [probes, direction]
    produces: results/abl_seed_random_seed1.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier random --fitness judge --seed 1 --out results/abl_seed_random_seed1.json"

  abl_seed_random_seed2:
    lane: core
    needs: [probes, direction]
    produces: results/abl_seed_random_seed2.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier random --fitness judge --seed 2 --out results/abl_seed_random_seed2.json"

  abl_fitness_probeact:         # Component 4 diagnostic: probe+judge fitness — NOT VALIDATED.
                                 # Probe failed Gate 2 novel-prompt generalization (see note
                                 # above). Kept only to re-test after the probe-generalization
                                 # fix; do not report headline numbers from this job until then.
    lane: extended
    needs: [probes, direction]
    produces: results/abl_fitness_probeact.json
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier human --fitness judge+act"

  # ---- transfer (RQ3) — all LOCAL on Kaggle, no external API ----
  transfer_local:               # replay optimized prompts on a 2nd small model (cross-family)
    lane: core
    needs: [ours]
    produces: results/transfer_local.json
    cmd: "python scripts/transfer_blackbox.py --config {config} --from results/ours.json --local"

  transfer_extra:               # a third target for a broader transfer table
    lane: extended
    needs: [ours]
    produces: results/transfer_extra.json
    cmd: "python scripts/transfer_blackbox.py --config {config} --from results/ours.json --local --target Qwen/Qwen2.5-1.5B-Instruct"

  # ---- defenses (RQ4) ----
  defense_ppl:
    lane: extended
    needs: [ours]
    produces: results/defense_ppl.json
    cmd: "python scripts/eval_defense.py --config {config} --defense perplexity --from results/ours.json"

  defense_smoothllm:
    lane: extended
    needs: [ours]
    produces: results/defense_smoothllm.json
    cmd: "python scripts/eval_defense.py --config {config} --defense smoothllm --from results/ours.json"

  # ---- target-difficulty ladder, dropped tiers (RQ3, PLAN.md §10) — FUTURE WORK, DO NOT LAUNCH
  # Status update 2026-08-06: the locked core design is Qwen2.5-3B + Phi-4-mini ONLY (2
  # targets) — phi4mini's job family was promoted to `lane: core` above (with the Qwen
  # tier). Qwen-7B and Gemma-9B below are DROPPED from the core design (compute-limited,
  # not "sequenced later" — see PLAN.md §10) and stay `lane: extended` indefinitely. This is
  # the SAME mechanism that already keeps autodan/amnesia/etc. out of `run_controller.py`'s
  # default `--lane core` ready set (see ORCHESTRATION.md's lane semantics). Do not pass
  # `--lane extended`/`--lane all` to the controller for these unless the core design is
  # revisited.
  #
  # Per-target job family = the same 8-job shape as the Qwen/phi4mini tiers above (probes,
  # direction, validate, gptfuzzer, ours, abl_mut_uniform, abl_seed_bootstrap,
  # abl_seed_random), namespaced under results/<tag>/ via explicit --out/--probes/--direction
  # flags (every underlying script already supports these overrides). Kept WITHOUT the
  # 3-seed variants the core tiers have — not worth scaffolding seeds for a dropped tier.
  #
  # gemma9b additionally has TWO unresolved code blockers, deferred indefinitely along with
  # the target itself — see configs/exp_gemma9b.yaml's header comment (gated HF access + no
  # device_map="auto" anywhere in this repo's model-loading code, confirmed via grep
  # 2026-08-06). Not being fixed while this target is dropped.

