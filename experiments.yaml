    produces: results/phi4mini/ours.json
    config: configs/exp_phi4mini.yaml
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation guided --seedtier human --fitness judge --out results/phi4mini/ours.json --probes results/phi4mini/probes/probe_best_layer.npz --direction results/phi4mini/direction.npz"

  abl_mut_uniform_phi4mini:
    lane: extended
    needs: [probes_phi4mini, direction_phi4mini]
    produces: results/phi4mini/abl_mut_uniform.json
    config: configs/exp_phi4mini.yaml
    cmd: "python scripts/run_fuzz.py --config {config} --method ours --mutation uniform --seedtier human --fitness judge --out results/phi4mini/abl_mut_uniform.json --probes results/phi4mini/probes/probe_best_layer.npz --direction results/phi4mini/direction.npz"

