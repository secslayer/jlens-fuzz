name: CI

on:
  # Widened from `branches: [main]` (reviews/stage7.md): this project's actual commits push
  # directly to feature branches (e.g. target-ladder-scaffold) from Kaggle sessions, not just
  # main -- the old scoping meant CI, including the content-scan step below, never ran on the
  # commits that actually needed checking.
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI-relevant deps
        run: pip install pytest pyyaml
      - name: Run tests
        run: python -m pytest -q
      - name: No raw jailbreak/completion text under results/ (reviews/stage7.md)
        run: python scripts/check_no_raw_text.py
