# Target-difficulty ladder -- FUTURE WORK, compute-limited, DROPPED from the core design
# 2026-08-06 (PLAN.md §10: locked core is Qwen2.5-3B + Phi-4-mini only, 2 targets). Kept as
# inert scaffolding (lane: extended in experiments.yaml, never launched) in case budget or
# scope reopens later -- Gemma remains the best-evidenced hard target if that happens
# (8% ASR vs. Llama-3.1's 22% on HarmBench is the only citable, consistent difficulty gap
# among the candidates considered -- see PLAN.md §10).
#
# Since Gemma is dropped from the core design, the device_map multi-GPU work below stays
# DEFERRED -- not being fixed now, no code changes planned until/unless this is revisited.
#
# TWO HARD BLOCKERS, confirmed 2026-08-06, NOT fixed, deferred indefinitely with this target:
#   1. GATED on Hugging Face (verified live via the HF API: gated="manual"). Request/accept
#      access at https://huggingface.co/google/gemma-2-9b-it before attempting to launch --
#      approval is not instant, so do this well before you need it.
#   2. ~18GB in fp16 EXCEEDS a single Kaggle T4 (16GB). Every model-loading script in this
#      repo (run_fuzz.py, train_probes.py, extract_direction.py, sanity_check.py,
#      validate_signal.py, probe_novel_check.py) currently hardcodes
#      `device = "cuda" if torch.cuda.is_available() else "cpu"` then `.to(device)` --
#      single-GPU only, confirmed via grep, NONE use device_map. This target REQUIRES
#      fp16 (non-negotiable, PLAN.md §10 -- quantization would corrupt the activation
#      signal the refusal direction depends on), so it must be split across BOTH T4s via
#      `device_map="auto"` instead. `scripts/run_parallel.sh` ALSO assumes 2 independent
#      single-GPU jobs (`CUDA_VISIBLE_DEVICES=0`/`=1` per job) -- a Gemma run needs both
#      GPUs for ONE job, so it cannot be paired with a second parallel job the way every
#      other run in this repo has been (half throughput on Gemma sessions; budget for it).
#      Fix both the model-loading code AND the launch path before attempting to run this.
seed: 0

target_model: "google/gemma-2-9b-it"

judge_model: "hubert233/GPTFuzz"           # diagnostic score only, see configs/exp.yaml's comment
judge_llm_model: "microsoft/Phi-3.5-mini-instruct"   # kept in sync though unused (dropped tier)

benchmark: "https://raw.githubusercontent.com/llm-attacks/llm-attacks/main/data/advbench/harmful_behaviors.csv"
n_behaviors: 25             # kept in sync with the locked core (was 50)
smoke_behaviors: 5

human_seed_templates: "https://raw.githubusercontent.com/sherdencooper/GPTFuzz/master/datasets/prompts/GPTFuzzer.csv"
seed_pool_size: 12   # locked 2026-08-07, PLAN.md §12 -- must match configs/exp.yaml exactly

query_budget: 40            # kept in sync with the locked core (was 50)
max_iterations: 100
mutate_model: "google/gemma-2-9b-it"   # local mutator == target, avoids a 2nd model load
decode_temperature: 0.7
decode_top_p: 0.9

probe_batch_size: 8   # halved vs. the smaller tiers -- less per-batch VRAM headroom even
                       # split across 2x16GB; tune down further if Stage 2 still OOMs
partial_forward: true

# Unrelated to this ladder (RQ3 cross-model transfer target, not a primary attack target) --
# intentionally unchanged across every tier's config so RQ3 stays comparable.
transfer_target_local: "microsoft/Phi-3.5-mini-instruct"
