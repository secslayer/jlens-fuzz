# Target-difficulty ladder -- FUTURE WORK, compute-limited, DROPPED from the core design
# 2026-08-06 (PLAN.md §10: locked core is Qwen2.5-3B + Phi-4-mini only, 2 targets, budget
# doesn't stretch to a 3rd/4th). Kept as inert scaffolding (lane: extended in
# experiments.yaml, never launched) in case budget or scope reopens later. Every invariant
# below is identical to configs/exp.yaml except target_model/mutate_model -- see CLAUDE.md
# rule 3 -- and kept in sync with the locked core's n_behaviors/query_budget even though
# unused, so it isn't stale if resumed.
seed: 0

# 7B params, ungated. ~14GB in fp16 -- fits a single T4 (16GB) but tight: little headroom
# for KV-cache/activations at longer sequence lengths. Watch for OOM; drop
# probe_batch_size first if Stage 2 (train_probes.py/extract_direction.py) OOMs before
# resorting to a 2nd GPU or quantization (quantization is explicitly ruled out --
# PLAN.md §10 -- it would corrupt the activation signal the refusal direction depends on).
target_model: "Qwen/Qwen2.5-7B-Instruct"

judge_model: "hubert233/GPTFuzz"           # diagnostic score only, see configs/exp.yaml's comment
judge_llm_model: "microsoft/Phi-3.5-mini-instruct"   # kept in sync though unused (dropped tier)

benchmark: "https://raw.githubusercontent.com/llm-attacks/llm-attacks/main/data/advbench/harmful_behaviors.csv"
n_behaviors: 25             # kept in sync with the locked core (was 50)
smoke_behaviors: 5

human_seed_templates: "https://raw.githubusercontent.com/sherdencooper/GPTFuzz/master/datasets/prompts/GPTFuzzer.csv"
seed_pool_size: 12   # locked 2026-08-07, PLAN.md §12 -- must match configs/exp.yaml exactly

query_budget: 40            # kept in sync with the locked core (was 50)
max_iterations: 100
mutate_model: "Qwen/Qwen2.5-7B-Instruct"   # local mutator == target, avoids a 2nd model load
decode_temperature: 0.7
decode_top_p: 0.9

probe_batch_size: 16   # first thing to reduce (e.g. 8) if Stage 2 feature extraction OOMs
partial_forward: true

# Unrelated to this ladder (RQ3 cross-model transfer target, not a primary attack target) --
# intentionally unchanged across every tier's config so RQ3 stays comparable.
transfer_target_local: "microsoft/Phi-3.5-mini-instruct"
