# Target-difficulty design (PLAN.md §10): LOCKED CORE tier 2/2, the "treatment" target.
# Promoted from extended-lane scaffold to core 2026-08-06, alongside configs/exp.yaml (Qwen2.5-3B,
# the "control"). DO NOT LAUNCH until the Qwen2.5-3B core lane (Stages 4-7) is complete and
# reviewed. Every invariant below is identical to configs/exp.yaml except target_model/
# mutate_model -- see CLAUDE.md rule 3: cross-target ASR comparisons are only valid if
# judge/benchmark/budget/decoding stay fixed and only the target varies.
seed: 0

# ~3.8B params, ungated. ~8GB in fp16, fits a single T4 (16GB) comfortably alongside
# activation/KV-cache overhead -- no device_map needed for this tier.
target_model: "microsoft/Phi-4-mini-instruct"

# CRITICAL FINDING (2026-08-06): false-positive judge, kept as a diagnostic score only --
# judge_llm_model below is the actual success determinant. See configs/exp.yaml's comment.
judge_model: "hubert233/GPTFuzz"

# Same fixed rubric judge as configs/exp.yaml, for cross-target comparability (CLAUDE.md rule
# 3). NOTE: Phi-3.5-mini judging Phi-4-mini-instruct completions is same-VENDOR but NOT
# self-grading -- different checkpoint, different training run, different capability tier.
# Flagged here explicitly since it's more directly relevant on this config than on Qwen's.
judge_llm_model: "microsoft/Phi-3.5-mini-instruct"

benchmark: "https://raw.githubusercontent.com/llm-attacks/llm-attacks/main/data/advbench/harmful_behaviors.csv"
# Locked 2026-08-06 to the affordable core design -- must match configs/exp.yaml exactly.
n_behaviors: 25
smoke_behaviors: 5

human_seed_templates: "https://raw.githubusercontent.com/sherdencooper/GPTFuzz/master/datasets/prompts/GPTFuzzer.csv"
seed_pool_size: 12   # locked 2026-08-07, PLAN.md §12 -- must match configs/exp.yaml exactly

query_budget: 40            # locked 2026-08-06, was 50 -- must match configs/exp.yaml exactly
max_iterations: 100
mutate_model: "microsoft/Phi-4-mini-instruct"   # local mutator == target, avoids a 2nd model load
decode_temperature: 0.7
decode_top_p: 0.9

probe_batch_size: 16
partial_forward: true

# Unrelated to this ladder (RQ3 cross-model transfer target, not a primary attack target) --
# intentionally unchanged across every tier's config so RQ3 stays comparable.
transfer_target_local: "microsoft/Phi-3.5-mini-instruct"
